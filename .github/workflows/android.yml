name: Android app

# Builds the Android app and publishes the APK as a download on the "android-latest" release.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Optional: a permanent signing key kept in the repository secrets.
      # Without it the APK is signed with a throwaway key, which is fine for installing it by hand.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk around-the-world.apk

      - uses: actions/upload-artifact@v4
        with:
          name: around-the-world-apk
          path: around-the-world.apk

      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --title "Around the World for Android" \
              --notes "The latest build of the Android app. Download around-the-world.apk on your phone and open it to install." \
              --target "$GITHUB_SHA"
          fi
          gh release upload android-latest around-the-world.apk --clobber
