plugins {
    id 'com.android.application'
}

// The build number comes from the GitHub run, so every build installs over the previous one.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
// A permanent signing key is optional: without it the build is signed with a throwaway debug key.
def keystorePath = System.getenv('KEYSTORE_FILE')

android {
    namespace 'io.github.chunguinius.aroundtheworld'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.chunguinius.aroundtheworld'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
